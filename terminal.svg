<svg width="600" height="260" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Fira Code', monospace">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="600" height="260" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="600" height="260" fill="#0d1117"/>
    <rect width="600" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="300" y="22" fill="#8b949e" font-size="13" text-anchor="middle">sudhanshu@github: ~</text>

    <text x="18" y="66" font-size="14.5" fill="#58a6ff">
      <tspan fill="#3fb950">➜</tspan> <tspan fill="#79c0ff">~</tspan> whoami
    </text>

    <text x="18" y="94" font-size="14.5" fill="#c9d1d9" opacity="0">
      sudhanshu-batra — final-year CS @ VIT
      <animate attributeName="opacity" begin="0.6s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>

    <text x="18" y="126" font-size="14.5" fill="#58a6ff" opacity="0">
      <tspan fill="#3fb950">➜</tspan> <tspan fill="#79c0ff">~</tspan> cat currently_building.txt
      <animate attributeName="opacity" begin="1.4s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>

    <text x="18" y="154" font-size="14.5" fill="#c9d1d9" opacity="0">
      FORKE — micro-task marketplace for devs
      <animate attributeName="opacity" begin="2.0s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>
    <text x="18" y="174" font-size="14.5" fill="#8b949e" opacity="0">
      building the review engine that grades submitted code
      <animate attributeName="opacity" begin="2.3s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>

    <text x="18" y="206" font-size="14.5" fill="#58a6ff" opacity="0">
      <tspan fill="#3fb950">➜</tspan> <tspan fill="#79c0ff">~</tspan> git log --oneline -1
      <animate attributeName="opacity" begin="3.0s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>
    <text x="18" y="234" font-size="14.5" fill="#f0883e" opacity="0">
      a1b2c3d 🫠 fixed bug I created yesterday
      <animate attributeName="opacity" begin="3.6s" dur="0.3s" fill="freeze" from="0" to="1"/>
    </text>

    <rect x="18" y="242" width="9" height="14" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" begin="4.2s" dur="0.6s" repeatCount="indefinite" values="1;0;1"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="599" height="259" rx="10" ry="10" fill="none" stroke="#30363d"/>
</svg>
