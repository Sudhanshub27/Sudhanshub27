<svg width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Fira Code', monospace">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="600" height="420" rx="10" ry="10"/>
